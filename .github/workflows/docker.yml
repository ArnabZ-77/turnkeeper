# Build the single-image app (FastAPI + React SPA) and push it to GitHub Container Registry.
# Azure App Service pulls ghcr.io/arnabz-77/turnkeeper:demo-stable (see docs/deploy-azure.md).
name: docker

on:
  push:
    branches: [demo-stable]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/arnabz-77/turnkeeper

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :demo-stable only from the demo-stable branch (a manual run on another branch gets only :sha-<short>)
          tags: |
            type=raw,value=demo-stable,enable=${{ github.ref == 'refs/heads/demo-stable' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Redeploy: az webapp restart -g <rg> -n <app>  (see docs/deploy-azure.md)"
          } >> "$GITHUB_STEP_SUMMARY"
