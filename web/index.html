<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Turnkeeper: an AI treasurer for rotating savings circles on the PayPal sandbox." />
    <title>Turnkeeper</title>
    <script>
      // Apply a saved theme before first paint so the page does not flash.
      (function () {
        try {
          var t = localStorage.getItem("tk-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* storage may be unavailable; the system preference applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
