# Tests and lint. No secrets needed: tests/conftest.py forces a fake sandbox config and every
# PayPal / LLM call is mocked.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The toolkit's pinned framework adapters are not needed; install it without deps (as in the Dockerfile).
          pip install "paypal-agent-toolkit==1.11.0" --no-deps && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests scripts skills

      - name: Pytest
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python dependency audit
        continue-on-error: true # advisory: a new CVE in a transitive dependency should not block unrelated merges
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install "paypal-agent-toolkit==1.11.0" --no-deps && pip install .
          pip-audit --skip-editable

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Web dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
